<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1620" viewBox="0 0 750 1620"><defs><radialGradient id="album"><stop stop-color="#91a7c9"/><stop offset=".55" stop-color="#344666"/><stop offset="1" stop-color="#172039"/></radialGradient></defs><rect width="750" height="1620" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#263348"><text x="60" y="130" font-size="26" fill="#77849a">LIBRAVIA</text><text x="60" y="220" font-size="52" font-weight="600">In the details.</text><text x="60" y="335" font-size="26" fill="#77849a">CHAPTER FOUR</text><text x="60" y="420" font-family="Georgia" font-size="30">The best tools are often the ones</text><text x="60" y="485" font-family="Georgia" font-size="30">we barely notice. They fit into the</text><text x="60" y="550" font-family="Georgia" font-size="30">rhythms of our lives, leaving space</text><text x="60" y="615" font-family="Georgia" font-size="30">for the work itself.</text><text x="60" y="680" font-family="Georgia" font-size="30"></text><text x="60" y="745" font-family="Georgia" font-size="30">A clear line. A considered proportion.</text><text x="60" y="810" font-family="Georgia" font-size="30">A little less noise. Each decision</text><text x="60" y="875" font-family="Georgia" font-size="30">creates room for something more</text><text x="60" y="940" font-family="Georgia" font-size="30">meaningful.</text></g><text x="60" y="1575" font-family="Arial" font-size="18" fill="#8b97a9">Illustrative interface · Replace with app screenshot</text></svg>